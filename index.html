<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b18">
<title>MEGH AI</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}
body{margin:0;background:#050b18;color:#eaf6ff;font-family:Arial,sans-serif;min-height:100vh}
.app{max-width:600px;margin:auto;padding:20px}
.header{text-align:center;padding:20px 0}
.logo{color:#00d9ff;font-size:28px;font-weight:bold;letter-spacing:5px}
.status{color:#00ff99;font-size:12px;margin-top:8px}
.orb{width:120px;height:120px;margin:25px auto;border-radius:50%;background:radial-gradient(circle,#00eaff 0%,#0077ff 40%,#00152f 75%);box-shadow:0 0 25px #008cff,0 0 60px #0044ff;animation:pulse 3s infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 25px #008cff,0 0 60px #0044ff}50%{transform:scale(1.08);box-shadow:0 0 40px #00d9ff,0 0 80px #0055ff}}
h1{text-align:center;font-size:23px}
.subtitle{text-align:center;color:#9bbbd5}
.chat{background:#0c1728;border:1px solid #173958;border-radius:15px;padding:15px;min-height:260px;max-height:45vh;overflow-y:auto;margin-top:20px}
.message{padding:12px;border-radius:12px;margin-bottom:12px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
.bot{background:#132940;border-left:3px solid #00cfff}
.user{background:#123b56;border-left:3px solid #00ff99}
.controls{display:flex;gap:8px;margin-top:15px}
input{flex:1;min-width:0;background:#101d30;border:1px solid #27506e;color:white;border-radius:10px;padding:14px;font-size:16px}
button{border:none;border-radius:10px;padding:12px 15px;background:#007bff;color:white;font-size:15px;cursor:pointer}
button:disabled{opacity:.5}
.voice{background:#00a78b}
.footer{text-align:center;color:#66839c;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="app">
<div class="header">
<div class="logo">MEGH AI</div>
<div class="status">● SYSTEM READY</div>
</div>
<div class="orb"></div>
<h1>আমি মেঘ, আপনার ব্যক্তিগত সহকারী</h1>
<div class="subtitle">বাংলায় কথা বলুন • Ask me anything</div>
<div class="chat" id="chat">
<div class="message bot">হ্যালো! আমি মেঘ। এখন আমার AI Brain-এর সঙ্গে সংযোগ স্থাপনের চেষ্টা করছি। আমাকে যেকোনো প্রশ্ন করতে পারেন।</div>
</div>
<div class="controls">
<input id="input" type="text" placeholder="এখানে লিখুন..." autocomplete="off">
<button id="sendBtn" onclick="sendMessage()">পাঠান</button>
<button class="voice" onclick="startListening()">🎤</button>
</div>
<div class="footer">MEGH AI • Bengali & English AI Assistant</div>
</div>
<script>
const API_URL="https://megh-ai-brain.uttamd38.workers.dev/";
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const sendBtn=document.getElementById("sendBtn");
let history=[];
let isBusy=false;
function addMessage(text,type){
 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
 return div;
}
function speak(text){
 if(!("speechSynthesis" in window))return;
 window.speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang=/[\u0980-\u09FF]/.test(text)?"bn-BD":"en-US";
 utterance.rate=.95;
 utterance.pitch=1;
 window.speechSynthesis.speak(utterance);
}
async function sendMessage(){
 const message=input.value.trim();
 if(!message||isBusy)return;
 isBusy=true;sendBtn.disabled=true;input.value="";
 addMessage(message,"user");
 const loading=addMessage("মেঘ ভাবছে... ☁️","bot");
 try{
  const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:message,history:history})});
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"AI সংযোগে সমস্যা হয়েছে");
  if(!data.reply)throw new Error("AI কোনো উত্তর দেয়নি");
  loading.textContent=data.reply;
  history.push({role:"user",text:message},{role:"model",text:data.reply});
  if(history.length>20)history=history.slice(-20);
  speak(data.reply);
 }catch(error){
  loading.textContent="দুঃখিত, মেঘের AI সংযোগে সমস্যা হয়েছে।\n\n"+error.message;
  console.error(error);
 }finally{isBusy=false;sendBtn.disabled=false;input.focus();}
}
input.addEventListener("keydown",event=>{if(event.key==="Enter")sendMessage();});
function startListening(){
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){addMessage("আপনার ব্রাউজারে Voice Recognition সমর্থিত নয়। Chrome ব্যবহার করে দেখুন।","bot");return;}
 const recognition=new SpeechRecognition();
 recognition.lang="bn-BD";recognition.continuous=false;recognition.interimResults=false;
 recognition.onstart=()=>addMessage("আমি শুনছি... 🎤","bot");
 recognition.onresult=event=>{input.value=event.results[0][0].transcript;sendMessage();};
 recognition.onerror=event=>addMessage("মাইক্রোফোনে সমস্যা হয়েছে: "+event.error,"bot");
 recognition.start();
}
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(error=>console.log("Service Worker:",error)));
}
</script>
</body>
</html>
